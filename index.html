<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Моніторинг залишків пального</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #17212b);
      --hint: var(--tg-theme-hint-color, #708499);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --field: var(--tg-theme-secondary-bg-color, #f1f3f5);
      --border: rgba(127, 127, 127, .25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
    }
    main { width: min(100%, 520px); margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 22px; color: var(--hint); line-height: 1.5; }
    .field { margin-bottom: 18px; }
    label, legend { display: block; margin-bottom: 8px; font-weight: 600; }
    select, input[type="number"] {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--field);
      color: var(--text);
      font: inherit;
    }
    fieldset { margin: 0 0 18px; padding: 0; border: 0; }
    .check-row { display: flex; align-items: center; gap: 10px; }
    .check-row label { margin: 0; }
    input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--button); }
    button {
      width: 100%;
      margin-top: 6px;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      background: var(--button);
      color: var(--button-text);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #status { min-height: 1.5em; margin-top: 12px; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Залишки пального</h1>
    <p>Оберіть базу та вкажіть поточні залишки.</p>
    <form id="fuel-form">
      <div class="field">
        <label for="base">База</label>
        <select id="base" name="base" required>
          <option value="" disabled selected>Оберіть базу</option>
          <option>Ольшаниця</option>
          <option>Чоп</option>
          <option>Скибнево</option>
          <option>Овидиополь</option>
        </select>
      </div>
      <div class="field">
        <label for="a95">A-95</label>
        <input id="a95" name="a95" type="number" min="0" step="any" inputmode="decimal" placeholder="Кількість" required>
      </div>
      <div class="field">
        <label for="dt">DT</label>
        <input id="dt" name="dt" type="number" min="0" step="any" inputmode="decimal" placeholder="Кількість" required>
      </div>
      <fieldset>
        <div class="check-row">
          <input id="no-changes" name="noChanges" type="checkbox">
          <label for="no-changes">Без змін</label>
        </div>
      </fieldset>
      <button id="send" type="submit">Надіслати</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script>
    (() => {
      const tg = window.Telegram?.WebApp;
      const form = document.getElementById('fuel-form');
      const base = document.getElementById('base');
      const a95 = document.getElementById('a95');
      const dt = document.getElementById('dt');
      const noChanges = document.getElementById('no-changes');
      const sendButton = document.getElementById('send');
      const status = document.getElementById('status');

      if (tg) {
        tg.ready();
        tg.expand();
      }

      noChanges.addEventListener('change', () => {
        const disabled = noChanges.checked;
        a95.disabled = disabled;
        dt.disabled = disabled;
        a95.required = !disabled;
        dt.required = !disabled;
        if (disabled) {
          a95.value = '';
          dt.value = '';
        }
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;

        if (!tg || typeof tg.sendData !== 'function') {
          status.textContent = 'Відкрийте цю сторінку через Telegram-бота, щоб надіслати дані.';
          return;
        }

        const lines = [`Залишки на НБ ${base.value}`];
        if (noChanges.checked) {
          lines.push('Без змін');
        } else {
          lines.push(`A-95: ${a95.value}`, `DT: ${dt.value}`);
        }
        const message = lines.join('\n');

        try {
          tg.sendData(message);
          sendButton.disabled = true;
          status.textContent = 'Дані надіслано боту.';
        } catch (error) {
          status.textContent = 'Не вдалося надіслати дані. ��пробуйте ще раз.';
          console.error('Telegram Web App sendData failed:', error);
        }
      });
    })();
  </script>
</body>
</html>
